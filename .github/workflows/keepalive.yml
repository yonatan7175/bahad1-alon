# Daily ping so a free Supabase project never pauses for inactivity (plan 12 — Risks).
# Set the repository variable SITE_URL (Settings → Secrets and variables → Actions → Variables).
name: Keep alive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.SITE_URL != ''
    steps:
      - run: curl --fail --silent --show-error --max-time 30 "${{ vars.SITE_URL }}/api/health"
