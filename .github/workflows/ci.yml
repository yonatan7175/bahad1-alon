# Automatic checks on every PR and on main (plan 08). Runs on Linux (ubuntu) — the same
# OS the portal will be hosted on (see LINUX.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: install · lint · types · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BAHAD_AUTH: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Path guard (a PR may only touch its own app's folders)
        if: github.event_name == 'pull_request'
        run: pnpm -s check:paths --base "origin/${{ github.base_ref }}" --head HEAD
      - name: Manifest validation + generated files
        run: pnpm gen
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit + API rule tests
        run: pnpm test
      - name: Simple-app static scan
        run: pnpm check:scan
      - name: Docs single-source check (CLAUDE.md rules block)
        run: pnpm docs:check
      - name: CODEOWNERS up to date
        run: pnpm -s codeowners --check
      - run: pnpm build

  e2e:
    name: end-to-end + security tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
