# /etc/nginx/sites-available/bahad — alternative to Caddy. TLS via certbot (certbot --nginx -d portal.example.com).
server {
    listen 80;
    server_name portal.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name portal.example.com;
    # ssl_certificate / ssl_certificate_key: added by certbot

    client_max_body_size 1m;

    # Live "changed" signals (SSE): no buffering, long reads.
    location /api/platform/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # The API's CSRF check compares Origin with Host — Host MUST be forwarded unchanged.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
