<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>אתר לדוגמה · מתחבר עם צ1</title>
    <style>
      :root { --bg: #f3f5f9; --card: #fff; --text: #111827; --muted: #5b6478; --accent: #1d3b6e; --line: #e3e7ef; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root { --bg: #070c18; --card: #101827; --text: #eef2fa; --muted: #9aa5bd; --accent: #8db4ff; --line: #1d283b; } }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
      main { max-width: 640px; margin: 0 auto; padding: 16px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 12px; }
      .muted { color: var(--muted); font-size: 14px; }
      button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      input { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); font: inherit; }
      ul { list-style: none; margin: 8px 0 0; padding: 0; }
      li { padding: 10px 0; border-top: 1px solid var(--line); }
      .badge { display: inline-block; margin-inline-start: 6px; padding: 1px 8px; border-radius: 999px; background: var(--line); font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>שלום <span id="name">…</span> 👋</h1>
      <p class="muted" id="unit"></p>
      <p class="muted" id="mock" hidden>מצב דמו (localhost) — משתמש ונתונים לדוגמה.</p>

      <section class="card" id="people-card" hidden>
        <h2>אנשי הגדוד</h2>
        <label class="muted" for="q">חיפוש</label>
        <input id="q" type="search" autocomplete="off" />
        <ul id="people"></ul>
      </section>

      <p style="margin-top: 16px"><button id="signout" type="button">התנתקות</button></p>
    </main>

    <script src="https://bahad1-alon.duckdns.org/connect.js"></script>
    <script type="module">
      const ROLE = { cadet: "חניך/ה", commander: "מפקד/ת", admin: "מנהל/ת" };
      const $ = (id) => document.getElementById(id);

      const user = await bahadConnect.requireUser(); // signs in with צ1 if needed
      $("name").textContent = user.name;
      $("unit").textContent = [ROLE[user.role], user.company, user.platoon].filter(Boolean).join(" · ");
      $("mock").hidden = !bahadConnect.mock;

      if (user.scopes.includes("directory")) {
        const people = await bahadConnect.people();
        const render = () => {
          const q = $("q").value.trim();
          const list = $("people");
          list.replaceChildren(
            ...people
              .filter((p) => !q || p.name.includes(q))
              .map((p) => {
                const li = document.createElement("li");
                li.textContent = p.name; // textContent: never innerHTML with names
                const badge = document.createElement("span");
                badge.className = "badge";
                badge.textContent = [ROLE[p.role], p.company, p.platoon, ...p.positions].filter(Boolean).join(" · ");
                li.append(badge);
                return li;
              }),
          );
        };
        $("q").addEventListener("input", render);
        render();
        $("people-card").hidden = false;
      }

      $("signout").addEventListener("click", async () => {
        await bahadConnect.signOut();
        location.reload();
      });
    </script>
  </body>
</html>
